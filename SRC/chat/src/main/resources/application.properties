spring.application.name=chat
# # Tắt cache Thymeleaf
spring.thymeleaf.cache=false
# Cấu hình tải file lên không quá 5MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# 1. Kết nối PostgreSQL (Identity Service - Chương 5)
spring.datasource.url=jdbc:postgresql://localhost:5433/userChat

spring.datasource.username=postgres
spring.datasource.password=123

# [QUAN TRỌNG] Phải khai báo Driver để Spring biết dùng thư viện nào
spring.datasource.driver-class-name=org.postgresql.Driver

# [QUAN TRỌNG] Khai báo Dialect để Hibernate biết cách viết SQL cho Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# 2. Kết nối MongoDB (Chat Service - Chương 2)
spring.data.mongodb.uri=mongodb://localhost:27017/personChat
# Khai báo cả Master và Slave, cách nhau bằng dấu phẩy
spring.datasource.url=jdbc:postgresql://localhost:5433,localhost:5434/userChat?targetServerType=primary
# 3. Kết nối Redis (Caching - Chương 4)
spring.data.redis.host=localhost
spring.data.redis.port=6379 
# Ví dụ: Giảm thời gian chờ Redis xuống 2 giây
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
# ... (Các cấu hình cũ giữ nguyên)




# --- CẤU HÌNH HEALTH CHECK (ACTUATOR) ---
# Bật các cổng kiểm tra
management.endpoints.web.exposure.include=health,info,metrics

# Hiển thị chi tiết (để biết rõ Database hay RabbitMQ cái nào chết)
management.endpoint.health.show-details=always